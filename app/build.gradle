plugins { id "com.android.application" }

android {
    namespace "com.abprod.carnet"
    compileSdk 34

    defaultConfig {
        applicationId "com.abprod.carnet"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "3.3.0"
    }

    // signature de publication : active seulement si les secrets sont fournis
    def ksPath = System.getenv("KEYSTORE_FILE")
    signingConfigs {
        release {
            if (ksPath) {
                storeFile file(ksPath)
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            if (ksPath) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Kotlin 1.8 a fusionne kotlin-stdlib-jdk7 et -jdk8 dans kotlin-stdlib.
    // Une dependance transitive tire encore les anciens artefacts en 1.6.21,
    // ce qui duplique des classes. On les aligne sur une version ou ils ne
    // sont plus que des alias vides.
    constraints {
        implementation "org.jetbrains.kotlin:kotlin-stdlib:1.8.22"
        implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22"
        implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22"
    }

    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "androidx.webkit:webkit:1.11.0"
    implementation "androidx.activity:activity:1.9.2"
}
