name: Construire l'application

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    # image figee : ubuntu-latest bascule vers Ubuntu 26 entre le 19 octobre
    # et le 19 novembre 2026, et l'outillage Android n'y est pas encore stable.
    runs-on: ubuntu-24.04
    # le contexte « secrets » n'est pas lisible dans un if d'etape :
    # on le transpose ici, au niveau du job, ou il est autorise.
    env:
      HAS_KEY: ${{ secrets.KEYSTORE_B64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Le SDK est deja sur l'image : on installe seulement les composants
      # manquants, sans dependre d'une action tierce.
      - name: Composants Android
        run: |
          set -e
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "SDK : $SDK"
          SDKMGR="$(find "$SDK/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n1)"
          if [ -z "$SDKMGR" ]; then echo "sdkmanager introuvable sous $SDK"; ls -la "$SDK" || true; exit 1; fi
          echo "sdkmanager : $SDKMGR"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          "$SDKMGR" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: APK installable directement
        run: gradle --no-daemon assembleDebug

      - name: Recuperer l'APK
        uses: actions/upload-artifact@v4
        with:
          name: carnet-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # Les etapes suivantes ne tournent que si la cle de signature est fournie
      # dans les secrets du depot (voir LISEZ-MOI.txt).
      - name: Reconstituer la cle de signature
        if: env.HAS_KEY == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"

      - name: AAB signe pour le Play Store
        if: env.HAS_KEY == 'true'
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/upload.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle --no-daemon bundleRelease

      - name: Recuperer l'AAB
        if: env.HAS_KEY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: carnet-aab
          path: app/build/outputs/bundle/release/app-release.aab
